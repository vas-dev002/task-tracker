<p-button label="Add new task" (click)="addTask()" />
@if (taskDialogVisible()){
<app-add-task-dialog (submitted)="handleResult($event)" (cancelled)="handleCancel()"> </app-add-task-dialog>}; @let items = tasks(); @if (items !==
undefined && items.length > 0) {
<p-table [value]="items" [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template #header>
    <tr>
      <th>Id</th>
      <th>Title</th>
      <th>Completed</th>
    </tr>
  </ng-template>
  <ng-template #body let-task>
    <tr>
      <td>{{ task.id }}</td>
      <td>{{ task.title }}</td>
      <td>{{ task.completed }}</td>
    </tr>
  </ng-template>
</p-table>
} @else { No tasks }
