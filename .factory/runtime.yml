# How the factory builds, starts, and probes this app. Human-owned: agents read
# this file but must not edit it.
version: 1

app:
  type: http
  name: smoke-app

runtime:
  image: python:3.12-slim

run:
  start: "python app.py"
  workdir: "."
  env:
    PORT: "8000"
  ports: [8000]
  ready:
    http: "http://localhost:8000/health"
    timeout: 60
