version: 1
scenario: "GET /uptime returns 200 with a non-negative numeric uptime_seconds"
steps:
  - id: uptime
    name: "Call the uptime endpoint"
    http:
      method: GET
      path: "/uptime"
    expect:
      status: 200
      headers:
        content-type: application/json
      body_contains: "uptime_seconds"
      json:
        has: ["uptime_seconds"]
      # The value must be a number (not a string/bool) and non-negative — key
      # presence alone would let a constant "0" string pass.
      json_number:
        uptime_seconds: { min: 0 }
