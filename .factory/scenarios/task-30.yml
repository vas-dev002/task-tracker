version: 1
scenario: "GET /e2e-3470 returns the value 3470 while /health stays intact"

steps:
  - id: e2e
    name: "GET /e2e-3470 returns 200 with JSON {\"value\": 3470}"
    http:
      method: GET
      path: /e2e-3470
    expect:
      status: 200
      headers:
        content-type: application/json
      json:
        has: [value]
        equals: { value: 3470 }

  - id: health
    name: "The existing /health endpoint is unchanged and still reports ok"
    http:
      method: GET
      path: /health
    expect:
      status: 200
      headers:
        content-type: application/json
      json:
        equals: { status: "ok" }

  - id: status
    name: "GET /status still returns 200 with JSON {\"status\": \"ok\"}"
    http:
      method: GET
      path: /status
    expect:
      status: 200
      headers:
        content-type: application/json
      json:
        equals: { status: "ok" }

  - name: "A path that merely starts with /e2e-3470 is still 404"
    http:
      method: GET
      path: /e2e-3470/extra
    expect:
      status: 404

  - name: "A path that merely starts with /health is still 404"
    http:
      method: GET
      path: /health/extra
    expect:
      status: 404

  - name: "The neighbouring e2e marker /e2e-5605 is untouched"
    http:
      method: GET
      path: /e2e-5605
    expect:
      status: 200
      headers:
        content-type: application/json
      json:
        equals: { value: 5605 }
