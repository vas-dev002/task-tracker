version: 1
scenario: "GET /health keeps working alongside the new /weekday endpoint"
steps:
  - name: "Health probe still returns 200"
    http: { method: GET, path: "/health" }
    expect:
      status: 200
  - name: "Weekday endpoint is served on the same app"
    http: { method: GET, path: "/weekday" }
    expect:
      status: 200
      body_contains: "weekday"
