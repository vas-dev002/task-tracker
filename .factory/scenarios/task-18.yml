version: 1
scenario: "GET /e2e-5605 returns the value 5605 while /health stays intact"

steps:
  - id: e2e
    name: "GET /e2e-5605 returns 200 with JSON {\"value\": 5605}"
    http:
      method: GET
      path: /e2e-5605
    expect:
      status: 200
      headers:
        content-type: application/json
      body_contains: '"value"'
      json:
        has: [value]
        equals: { value: 5605 }

  - id: health
    name: "The existing /health endpoint is unchanged and still reports ok"
    http:
      method: GET
      path: /health
    expect:
      status: 200
      headers:
        content-type: application/json
      json:
        equals: { status: "ok" }

  - name: "A path that merely starts with /e2e-5605 is still 404"
    http:
      method: GET
      path: /e2e-5605/extra
    expect:
      status: 404
